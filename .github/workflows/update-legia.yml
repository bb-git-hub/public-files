name: Update Legia Ladies Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate calendar
        run: |
          python legia-ladies.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add legia-ladies.ics
          git add page.html

          git diff --staged --quiet || (
            git commit -m "Aktualizacja kalendarza Legia Ladies"
            git push
          )
